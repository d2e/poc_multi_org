enrichment_tables:
  orgs:
    type: file
    file:
      path: /etc/vector/org-lookup.csv
      encoding:
        type: csv

sources:
  keycloak_webhook:
    type: http_server
    address: 0.0.0.0:2021
    path: /log/ingest
    # Deliberately "bytes", not "json" -- HMAC verification (see
    # verify_signature below) must be computed over the *exact* raw bytes
    # Keycloak signed, and re-serializing an already-parsed JSON object
    # is not guaranteed to reproduce those bytes (key order, spacing,
    # escaping can all differ). Parsing happens explicitly, after
    # verification, in verify_signature itself.
    decoding:
      codec: bytes
    headers: ["X-Keycloak-Signature"]

transforms:
  # Keycloak's ext-event-webhook was previously registered with
  # authType: none -- anything on the docker network could POST fabricated
  # events into this pipeline (forge audit-log entries) or just flood it.
  # Verified empirically (not assumed) against a real Keycloak-signed
  # request that the signature is lowercase-hex HMAC-SHA256 of the raw
  # request body -- see docs/opensearch-auth.md.
  verify_signature:
    type: remap
    inputs: ["keycloak_webhook"]
    source: |
      sig = get(., ["X-Keycloak-Signature"]) ?? ""
      expected = encode_base16(hmac!(.message, "${WEBHOOK_HMAC_SECRET_VECTOR}", algorithm: "SHA-256"))
      if sig == "" || sig != expected {
        abort
      }
      . = merge!(., parse_json!(.message))
      del(.message)
      del(."X-Keycloak-Signature")

  enrich_org_name:
    type: remap
    inputs: ["verify_signature"]
    # Keycloak webhook events only ever carry an org UUID, never its name, and not
    # even in a consistent field: org-membership admin events embed it in
    # resourcePath ("orgs/{id}/members/{userId}"), while the active-organization
    # switch event carries it in details.*_organization_id. Resolve whichever is
    # present against the "orgs" enrichment table (opensearch/org-lookup.csv,
    # regenerated by scripts/org_cache_watcher.py).
    #
    # Also resolves a top-level "tenant" field (see docs/multi-env-tenants.md)
    # from the org's own "tenant" custom attribute -- unified across all three
    # resolution paths below so "which events belong to tenant X" is one
    # field to filter/aggregate on, regardless of event type. Login events
    # get this too even though they carry no org id at all: details.identity_provider
    # is the broker alias, which is always exactly the org name in this
    # project's convention (alias == org name, see provision_platform_orgs.py
    # and provision_globex_tenant.py), so it doubles as a lookup key.
    source: |
      if exists(.details.new_active_organization_id) {
        row, err = get_enrichment_table_record("orgs", {"id": .details.new_active_organization_id})
        if err == null {
          .details.new_active_organization_name = row.name
          if row.tenant != "" { .tenant = row.tenant }
        }
      }
      if exists(.details.previous_active_organization_id) {
        row, err = get_enrichment_table_record("orgs", {"id": .details.previous_active_organization_id})
        if err == null { .details.previous_active_organization_name = row.name }
      }
      if exists(.resourcePath) {
        caps, err = parse_regex(.resourcePath, r'^orgs/(?P<org_id>[0-9a-fA-F-]{36})')
        if err == null {
          .org_id = caps.org_id
          row, err2 = get_enrichment_table_record("orgs", {"id": caps.org_id})
          if err2 == null {
            .org_name = row.name
            if row.tenant != "" { .tenant = row.tenant }
          }
        }
      }
      if exists(.details.identity_provider) {
        row, err = get_enrichment_table_record("orgs", {"name": .details.identity_provider})
        if err == null {
          .org_id = row.id
          .org_name = row.name
          if row.tenant != "" { .tenant = row.tenant }
        }
      }

sinks:
  opensearch:
    type: elasticsearch
    inputs: ["enrich_org_name"]
    # https + TLS now required (OpenSearch security plugin's self-signed
    # demo cert -- see docs/opensearch-auth.md).
    endpoints: ["https://opensearch:9200"]
    tls:
      verify_certificate: false
    # vector_writer: a dedicated static internal OpenSearch user scoped only
    # to write keycloak-events* (see opensearch/security-config/), not
    # Keycloak-issued identity -- Vector's elasticsearch sink has no
    # OAuth2/bearer-refresh support at all, so a Keycloak access token would
    # 401 within minutes of any `docker compose up`. See docs/gotchas.md.
    auth:
      strategy: basic
      user: vector_writer
      password: "Vector-Writer-Dev-2026!"
    mode: bulk
    bulk:
      index: "keycloak-events"
      # "create" (not "index"): reject overwriting a document that already
      # exists rather than silently applying it -- a real gap this closes,
      # since vector_writer's role previously permitted overwriting/deleting
      # any existing keycloak-events document via a bulk "index" action.
      # id_key uses Keycloak's own event "id" field (confirmed present and
      # stable on both ADMIN and USER events, unlike the separate "uid"
      # field, which is a per-webhook-*delivery-attempt* id per the
      # extension's own docs -- using "id" also means a legitimate webhook
      # retry of the same event is correctly deduplicated, not just blocked
      # tampering) as the OpenSearch document _id, so "create" has something
      # stable to reject a duplicate against.
      action: create
    id_key: "id"
    api_version: v7
    healthcheck:
      enabled: false
